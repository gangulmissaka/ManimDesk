[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "manimdesk"
dynamic = ["version"]
description = "A simple cross-platform desktop app for rendering Manim maths and physics animations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "gangulmissaka" }]
requires-python = ">=3.11"
dependencies = ["manim>=0.19"]
keywords = ["manim", "animation", "math", "physics", "education", "gui", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
science = ["scipy", "sympy", "matplotlib"]

[project.urls]
Homepage = "https://github.com/gangulmissaka/ManimDesk"
Issues = "https://github.com/gangulmissaka/ManimDesk/issues"

[project.gui-scripts]
manimdesk = "manimdesk.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/manimdesk/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
